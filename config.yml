crons:
  arpan-claude-optimization-suggestions:
    id: 72efab32-c0f7-4d93-9257-2b07f13ebb9e
    schedule: 0 13 * * 5
    prompt: It's time for this week's Claude Code optimization review. Invoke the /arpan-claude-optimization-suggestions skill — it encodes the full workflow (ingest the arps18 blog, survey the user's ~/.claude/ setup, generate 10 proposals, rank top 3, present in this mission, post a notification doorbell).
    description: "Weekly: read arps18 Claude Code Mastery blog + ~/.claude/, propose 10 improvements, present top 3 in-mission, post notification"
  claude-news-processor:
    id: 7c6d6398-82c4-4824-9b2d-a054a75c1c27
    schedule: 0 9 * * 5
    prompt: Read the Claude blog and process any new posts through the lens of my setup. Write findings to findings/YYYY-MM-DD.md and update notes.md.
    description: Weekly scan of Claude blog for setup improvement opportunities
    repo: github.com/mieubrisse/claude-news-processor
  daily-state-summary:
    id: 04af416d-5fb0-4bac-81e8-a57633aa862e
    schedule: 30 23 * * *
    prompt: You were spawned by the daily-state-summary cron. Invoke the /daily-state-summary skill and follow it end-to-end. The skill is the single writer of the daily-state-summary AI-journal artifact; it computes its own source-pulling window and writes the entry. After the skill returns, exit.
    description: Nightly factual snapshot of the workday that just ended, written to the AI journal at 23:30 local. The skill computes its own source window (since the previous entry's write-time, with a 24h fallback) — robust to laptop-sleep catchups and missed days. Independent of `/end-of-day-review`, which captures Kevin's reflection separately.
    notificationsEnabled: false
  exobrain-update:
    id: 4d6b9cbe-30f5-4415-bab3-9870a187ffcd
    schedule: 0 23 * * 4
    prompt: You were spawned by the exobrain-update cron. Invoke /exobrain-update and follow it end-to-end.
    description: Nightly autonomous email to Yannik Zimmermann summarizing Kevin's automation / Claude-config developments since the last send. Skill owns the full pipeline incl. a two-redactor convergence gate; fails safe (notification, no send) on any redaction veto.
    notificationsEnabled: false
  flight-watcher:
    id: 39ee4356-a973-4a97-aee0-fba688330b1b
    schedule: 0 7 * * *
    prompt: You were spawned by the flight-watcher cron. Invoke the /flight-watcher skill and follow it end-to-end.
    description: Daily flight watchlist check — posts an AgenC notification only when a buy signal fires
    notificationsEnabled: false
  hn-daily-pull:
    id: fd227c03-7f1e-46b2-9a5f-29776f854f75
    schedule: 0 2 * * *
    prompt: You were spawned by the hn-daily-pull cron. Invoke the /hacker-news-daily-pull skill and follow it end-to-end.
    description: Nightly Hacker News personalized digest, posted as an AgenC notification
    notificationsEnabled: false
  verify-workspace-mcp-denylist:
    id: bf6eac47-da15-4d70-b0bf-58c7798e48ad
    schedule: 11 5 17 * *
    prompt: Invoke the /verify-workspace-mcp-denylist skill to audit the workspace-mcp destructive-action protection against the live tool catalog. Stay silent on a clean result; post an AgenC notification on findings or anything blocking a clean check (see the skill's Fail Loudly section).
    description: Monthly audit of ~/.claude/hooks/workspace-mcp-action-denylist.txt and the inline guards in block-workspace-mcp-destructive-actions.sh against the live workspace-mcp tool catalog. Posts a notification only when action is needed.
paletteCommands:
  copyMissionUuid:
    tmuxKeybinding: -n C-,
  refine:
    title: 👨‍🔬 Refine
    description: Launch an Adjutant mission to refine lessons from the current mission
    command: agenc mission new --adjutant --prompt "In mission $AGENC_CALLING_MISSION_UUID I hit some friction and I want to make some refinements. I'm going to describe these friction points, and we can decide together how to roll this back into the system."
