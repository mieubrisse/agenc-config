syncedRepos:
- github.com/mieubrisse/dotfiles
tmuxAgencFilepath: ~/app/agenc/agenc
paletteCommands:
  agenc-dev:
    title: 🤖 Open AgenC
    command: "agenc tmux window new -- agenc mission new github.com/mieubrisse/agenc"
  calendarManager:
    title: 📅 Open Calendar Manager
    command: "agenc tmux window new -- agenc mission new github.com/mieubrisse/calendar-manager"
  dotfiles:
    title: 🔧 Open Dotfiles
    command: "agenc tmux window new -- agenc mission new github.com/mieubrisse/dotfiles"
  personalWriting:
    title: 📝 Open Personal Writing
    command: "agenc tmux window new -- agenc mission new github.com/mieubrisse/personal-writing"
  todoistManager:
    title: ✅ Open Todoist Manager
    command: "agenc tmux window new -- agenc mission new github.com/mieubrisse/todoist-manager"
paletteTmuxKeybinding: "-n C-y"
doAutoConfirm: true
