repoConfig:
  github.com/mieubrisse/agenc:
    windowTitle: "🚀 "
  github.com/mieubrisse/calendar-manager:
    windowTitle: "📅 "
    trustedMcpServers:
    - google-calendar
  github.com/mieubrisse/dotfiles:
    windowTitle: "🛠️ "
  github.com/mieubrisse/personal-writing:
    windowTitle: "📝 "
  github.com/mieubrisse/researcher:
    windowTitle: "🔍 "
  github.com/mieubrisse/todoist-manager:
    windowTitle: "✅ "
paletteCommands:
  agenc-dev:
    title: 🚀 Open AgenC
    command: "agenc tmux window new -a -- agenc mission new github.com/mieubrisse/agenc"
  calendarManager:
    title: 📅  Open Calendar Manager
    command: "agenc tmux window new -a -- agenc mission new github.com/mieubrisse/calendar-manager"
  checklistsAndTemplates:
    title: ✅ Open Checklists & Templates
    command: "agenc tmux window new -a -- agenc mission new github.com/mieubrisse/checklists-and-templates"
  dotfiles:
    title: 🛠️   Open Dotfiles
    command: "agenc tmux window new -a -- agenc mission new github.com/mieubrisse/dotfiles"
  personalWriting:
    title: 📝  Open Personal Writing
    command: "agenc tmux window new -a -- agenc mission new github.com/mieubrisse/personal-writing"
  refine:
    title: 🔧 Refine
    description: Launch an Adjutant mission to refine lessons from the current mission
    command: "agenc tmux window new -- agenc mission new --adjutant --prompt \"In mission $AGENC_CALLING_MISSION_UUID I hit some friction and I want to make some refinements. I'm going to describe these friction points, and you can decide how we can best roll these lessons back into the system.\""
  researcher:
    title: 🔍  Researcher
    command: "agenc tmux window new -a -- agenc mission new github.com/mieubrisse/researcher"
  todoistManager:
    title: ✅  Open Todoist Manager
    command: "agenc tmux window new -a -- agenc mission new github.com/mieubrisse/todoist-manager"
tmuxWindowTitle: {}
defaultModel: opus
