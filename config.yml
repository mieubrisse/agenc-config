crons:
  claude-news-processor:
    id: 7c6d6398-82c4-4824-9b2d-a054a75c1c27
    schedule: 0 9 * * 5
    prompt: Read the Claude blog and process any new posts through the lens of my setup. Write findings to findings/YYYY-MM-DD.md and update notes.md.
    description: Weekly scan of Claude blog for setup improvement opportunities
    repo: github.com/mieubrisse/claude-news-processor
  hn-daily-pull:
    id: fd227c03-7f1e-46b2-9a5f-29776f854f75
    schedule: 0 2 * * *
    prompt: You were spawned by the hn-daily-pull cron. Invoke the /hacker-news-daily-pull skill and follow it end-to-end.
    description: Nightly Hacker News personalized digest, posted as an AgenC notification
  verify-composio-denylist:
    id: 2f1c1cf5-76ad-4cbd-8fcc-5446ffbd49aa
    schedule: 0 5 13 * *
    prompt: "Verify the Composio destructive-tools denylist at ~/.claude/hooks/composio-tool-slug-denylist.txt.\n\nYou must NOT modify the denylist file or the hook script (~/.claude/hooks/block-composio-destructive-tools.sh). Your job is to produce a report only — actual changes are the user's call.\n\nFAIL LOUDLY\n-----------\n\nThe whole point of this monthly check is to catch silent drift between the denylist and the live Composio tool catalog. If something prevents you from completing the verification cleanly, the user MUST hear about it — silence on a blocked run is the worst possible outcome (the user assumes \"no notification = all clear\" and trusts a denylist that was never actually verified).\n\nSo: any blocker that prevents a clean verification — Composio auth expired, MCP server unreachable, denylist file missing or unreadable, tool-listing call returning empty/malformed data, anything else that makes you unsure the check actually ran — MUST trigger a notification with title prefixed \"Composio denylist verification BLOCKED:\" and a body explaining what blocked it and what the user needs to do (re-auth, restart MCP, restore file, etc.).\n\nOnly stay silent when you have actually completed both checks below AND both came up clean.\n\nDo this:\n\n1. Read the current denylist file. If unreadable or missing → fail loudly per above. Otherwise, note all active (uncommented) slugs.\n\n2. Authenticate with Composio MCP, then enumerate the Composio toolkits and tools the user has connected. Focus on toolkits represented in the denylist (currently Gmail) plus any others connected (Calendar, Drive, Docs, Sheets, etc.). If auth fails, MCP is down, or enumeration returns nothing → fail loudly per above.\n\n3. Check #1 — stale entries: For each denylist entry, verify the slug still exists as a real Composio tool name. Flag any slug that no longer matches — Composio may have renamed it (silent allow-through) or removed it.\n\n4. Check #2 — missing entries: Scan all connected Composio tools for destructive operations that are NOT in the denylist. \"Destructive\" = permanently deletes user data with no recovery (e.g., DELETE, REMOVE, PURGE, DISCARD, PERMANENTLY_*). Also flag operations that bulk-modify data in hard-to-reverse ways. Use judgment — err on the side of flagging. Cross-reference with the existing entries to understand the bar.\n\n5. Decide whether to notify:\n\n   - If BOTH checks completed cleanly AND came up empty (no stale entries AND no candidate new entries) → do nothing. Do NOT post a notification.\n\n   - If EITHER check has findings → compose a Markdown report and post it as an AgenC notification:\n\n       agenc notifications create \\\n         --kind=composio.denylist_verification \\\n         --title=\"Composio denylist: <N> finding(s) need review\" \\\n         --body-file=<path to report>\n\n     Report sections (omit any with no content):\n       - Stale denylist entries (slug renamed or removed) — high priority\n       - Candidate new denylist entries (destructive tools not yet listed)\n       - Notes / uncertainty (anything you couldn't verify cleanly)\n\n   - If anything blocked a clean verification → notification with title prefixed \"Composio denylist verification BLOCKED:\" as described in the FAIL LOUDLY section.\n\nDo NOT edit the denylist file. Do NOT edit the hook script. The user reads the notification (when posted) and decides what to change."
    description: Monthly audit of ~/.claude/hooks/composio-tool-slug-denylist.txt against the live Composio tool catalog. Posts a notification only when action is needed.
paletteCommands:
  refine:
    title: 👨‍🔬 Refine
    description: Launch an Adjutant mission to refine lessons from the current mission
    command: agenc mission new --adjutant --prompt "In mission $AGENC_CALLING_MISSION_UUID I hit some friction and I want to make some refinements. I'm going to describe these friction points, and we can decide together how to roll this back into the system."
